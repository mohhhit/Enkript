name: enkript
description: A secure cross-platform password manager with auto-fill capabilities
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Security (flutter_secure_storage removed - causing symlink issues)
  # flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Cloud Services (Updated for Windows compatibility)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  
  # Biometric Authentication
  local_auth: ^3.0.2
  
  # Password Generation
  uuid: ^4.3.3
  
  # Platform Detection (commented out - causing symlink issues on different drives)
  # device_info_plus: ^9.1.1
  # package_info_plus: ^5.0.1
  
  # Utilities
  intl: ^0.20.3
  # url_launcher: ^6.2.3  # Commented out - causing symlink issues
  # share_plus: ^7.2.2    # Commented out - causing symlink issues

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
